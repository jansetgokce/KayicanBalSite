<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sıkça Sorulan Sorular – Kayıcan Bal</title>
  <meta name="description" content="Bal, polen ve perga hakkında sıkça sorulan sorular; saklama, kullanım, sipariş ve teslimat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Playfair+Display:ital,wght@1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <script>try{if(sessionStorage.getItem("kc-bee"))document.documentElement.classList.add("no-preloader")}catch(e){}</script>
</head>
<body data-page="sss">

  <div id="preloader" role="status" aria-label="Yükleniyor">
    <svg class="bee" viewBox="0 0 100 80" aria-hidden="true">
      <defs><clipPath id="bodyClip"><ellipse cx="50" cy="48" rx="24" ry="16"/></clipPath></defs>
      <ellipse class="wing wing-l" cx="42" cy="28" rx="11" ry="16" fill="#bfe6f5" fill-opacity=".75" stroke="#8cc6dc"/>
      <ellipse class="wing wing-r" cx="58" cy="28" rx="11" ry="16" fill="#bfe6f5" fill-opacity=".75" stroke="#8cc6dc"/>
      <ellipse cx="50" cy="48" rx="24" ry="16" fill="#f5b800"/>
      <g clip-path="url(#bodyClip)" fill="#2b2b2b"><rect x="38" y="30" width="6" height="40"/><rect x="52" y="30" width="6" height="40"/></g>
      <path d="M26 48 L16 48 L26 52 Z" fill="#2b2b2b"/>
      <circle cx="77" cy="46" r="10" fill="#2b2b2b"/><circle cx="80" cy="43" r="2.6" fill="#fff"/>
      <path d="M80 37 q4 -8 9 -9 M76 36 q1 -8 5 -11" stroke="#2b2b2b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <section class="page-head">
    <p class="crumbs"><a href="index.html">Ana Sayfa</a> / S.S.S.</p>
    <h1 class="sec-title">Sıkça Sorulan Sorular</h1>
    <p class="sec-lead">Bal, polen ve perga hakkında merak edilenler.</p>
  </section>

  <main class="sec cream">
    <div class="wrap">
      <div class="toolbar" style="max-width:880px;margin-inline:auto">
        <p class="count" id="count"></p>
        <div class="tools-row">
          <label class="field">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="q" type="search" placeholder="Soru ara…" aria-label="Soru ara">
          </label>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <div class="faq-list" id="list"></div>
      <p class="empty" id="empty" hidden>Aramanızla eşleşen soru bulunamadı.</p>
    </div>
  </main>

  <section class="cta-band">
    <h2>Cevabı bulamadınız mı?</h2>
    <p>Sorunuzu bize iletin, en kısa sürede dönüş yapalım.</p>
    <div class="row" id="ctaRow"></div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/data.en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/site.js"></script>
  <script>
    const $ = (s, r = document) => r.querySelector(s);
    let cat = "all", query = "";

    $("#chips").innerHTML = `<button class="chip is-active" data-cat="all">Tümü</button>` +
      Object.keys(FAQ_CATS).map(k => `<button class="chip" data-cat="${k}">${FAQ_CATS[k]}</button>`).join("");

    function render() {
      const words = KC.lower(query).trim().split(/\s+/).filter(Boolean);
      const items = FAQ.map((f, i) => ({ f, i })).filter(({ f }) => {
        if (cat !== "all" && f.cat !== cat) return false;
        const hay = KC.lower(f.q + " " + f.a.join(" "));
        return words.every(w => hay.includes(w));
      });
      $("#list").innerHTML = items.map(({ f, i }) => KC.faqItem(f, i)).join("");
      $("#empty").hidden = items.length > 0;
      $("#count").textContent = `${items.length} soru bulundu`;
    }

    function openFromHash() {
      const m = location.hash.match(/^#q-(\d+)$/);
      if (!m) return;
      let el = document.getElementById("q-" + m[1]);
      if (!el) {                       // filtre yüzünden gizliyse sıfırla
        cat = "all"; query = ""; $("#q").value = "";
        document.querySelectorAll(".chip").forEach(x => x.classList.toggle("is-active", x.dataset.cat === "all"));
        render(); el = document.getElementById("q-" + m[1]);
      }
      if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "center" }); }
    }

    $("#chips").addEventListener("click", e => {
      const c = e.target.closest(".chip"); if (!c) return;
      document.querySelectorAll(".chip").forEach(x => x.classList.toggle("is-active", x === c));
      cat = c.dataset.cat; render();
    });
    $("#q").addEventListener("input", e => { query = e.target.value; render(); });
    window.addEventListener("hashchange", openFromHash);

    const row = [];
    const wa = KC.waLink(t("Merhaba, bir sorum var."));
    if (wa) row.push(`<a class="btn btn-light ext" href="${wa}" ${KC.EXT}>WhatsApp'tan Sorun</a>`);
    row.push(`<a class="btn ${wa ? "btn-outline" : "btn-light"}" href="iletisim.html">İletişim Formu</a>`);
    $("#ctaRow").innerHTML = row.join("");

    render();
    openFromHash();
  </script>
</body>
</html>
